                } catch (e) {
                    appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
                }
            } else {
                appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
            }

            if (!appData.selectedDate) appData.selectedDate = "12/19";
            if (!appData.selectedMember) appData.selectedMember = "ALL";

            // 確保第一個頁籤名稱為「交通」
            if (appData.tabs && appData.tabs.length > 0) {
                if (appData.tabs[0].name === '時間' || appData.tabs[0].name === '時間 & 交通憑證') {
                    appData.tabs[0].name = '交通';
                }
            }

            document.getElementById("handbook-title").innerText = appData.title || DEFAULT_DATA.title;
            document.getElementById("handbook-subtitle").innerText = appData.subtitle || DEFAULT_DATA.subtitle;

            renderTabBar();
            renderActiveTabContent();
        }

            localStorage.setItem("morandi_travel_handbook_v4", JSON.stringify(appData));
        }

        function showToast(msg) {
            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");
            toast.className = "pointer-events-auto bg-morandi-text text-white px-4 py-2.5 rounded-2xl shadow-lg text-sm font-semibold flex items-center space-x-2 transition-all duration-300 transform translate-y-2 opacity-0";
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-morandi-green"></i><span>${msg}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove("translate-y-2", "opacity-0");
            }, 10);

            setTimeout(() => {
                toast.classList.add("opacity-0", "translate-y-2");
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

            appData.title = el.innerText.trim();

            const twdTotal = Math.round(totalAmount * 0.21);

                    <div class="bg-white rounded-2xl p-6 border border-morandi-border shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">

                                ${currentExpenseFilter === 'ALL' ? '全體共同花費總計' : `類別 [ ${currentExpenseFilter} ] 統計金額`}
                            </span>

                        </div>

                        </div>
                    </div>

                    <div class="bg-white rounded-2xl border border-morandi-border overflow-hidden shadow-sm">
                        <div class="px-6 py-4 bg-morandi-bg border-b border-morandi-border font-bold text-base text-morandi-text flex justify-between items-center">
                            <span>${currentExpenseFilter === 'ALL' ? '全體支出明細列表' : `[ ${currentExpenseFilter} ] 專屬明細列表`}</span>
                            <span class="text-xs text-morandi-muted font-normal">共 ${filteredList.length} 筆</span>
                        </div>

                            <div class="p-8 text-center text-morandi-muted">該分類目前尚無支出紀錄</div>

                            <div class="divide-y divide-morandi-border/60">
                                ${filteredList.map(item => `
                                    <div class="p-4 sm:p-5 flex items-center justify-between hover:bg-morandi-bg/40 transition group">
                                        <div class="space-y-1">
                                            <div class="flex items-center space-x-2">
                                                <span class="text-xs px-2.5 py-0.5 rounded-full bg-morandi-bg text-morandi-text font-medium border border-morandi-border">${item.category}</span>
                                                <h4 class="font-bold text-base sm:text-lg text-morandi-text">${item.name}</h4>
                                            </div>
                                            <div class="text-xs sm:text-sm text-morandi-muted flex items-center space-x-3">
                                                <span><i class="fa-regular fa-credit-card mr-1"></i>${item.payer || '公金'}</span>
                                                ${item.note ? `<span>• ${item.note}</span>` : ''}
                                            </div>
                                        </div>
                                        <div class="flex items-center space-x-3">
                                            <span class="font-mono font-bold text-base sm:text-lg text-morandi-text">¥ ${(Number(item.amount) || 0).toLocaleString()}</span>
                                            <div class="no-print flex space-x-1 opacity-80 group-hover:opacity-100 transition">
                                                <button onclick="editExpense('${item.id}')" class="text-base text-morandi-muted hover:text-morandi-purple p-1.5 rounded"><i class="fa-solid fa-pen"></i></button>
                                                <button onclick="deleteExpense('${item.id}')" class="text-base text-morandi-muted hover:text-red-500 p-1.5 rounded"><i class="fa-solid fa-trash"></i></button>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        function renderChecklistTab() {
            const members = appData.checklistMembers || [];
            const list = appData.checklists || [];
            const selectedMember = appData.selectedMember || "ALL";

            const filteredList = selectedMember === "ALL" 
                ? list 
                : list.filter(item => item.memberId === selectedMember);

            const completedCount = filteredList.filter(i => i.checked).length;
            const progressPct = filteredList.length ? Math.round((completedCount / filteredList.length) * 100) : 0;

            return `
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2.5">
                            <span class="w-3.5 h-8 bg-morandi-yellow rounded-full inline-block"></span>
                            <h2 class="text-2xl sm:text-3xl font-bold text-morandi-text">準備清單</h2>
                        </div>
                        <button onclick="openChecklistEditor()" class="no-print text-sm sm:text-base bg-morandi-yellow text-morandi-text px-4 py-2.5 rounded-xl hover:bg-morandi-yellow/90 transition font-bold shadow-sm">
                            <i class="fa-solid fa-plus mr-1.5"></i>新增清單項
                        </button>
                    </div>

                    <!-- Member Selector Buttons -->
                    <div class="bg-white rounded-2xl p-5 border border-morandi-border shadow-sm space-y-3">
                        <div class="text-sm font-bold text-morandi-muted">切換個人專屬準備清單：</div>
                        <div class="flex items-center space-x-3 overflow-x-auto pb-1 no-scrollbar">
                            <button onclick="selectChecklistMember('ALL')" class="px-4 py-2 rounded-2xl font-bold text-sm sm:text-base transition ${selectedMember === 'ALL' ? 'bg-morandi-text text-white shadow' : 'bg-morandi-bg text-morandi-text border border-morandi-border hover:bg-morandi-border/50'}">
                                全體成員
                            </button>
                            ${members.map(m => {
                                const isSel = selectedMember === m.id;
                                const memTheme = MEMBER_COLOR_MAP[m.color] || MEMBER_COLOR_MAP.purple;

                                return `
                                    <div class="relative group flex-shrink-0">
                                        <button onclick="selectChecklistMember('${m.id}')" class="px-4 py-2 rounded-2xl font-bold text-sm sm:text-base transition flex items-center gap-1.5 ${
                                            isSel ? `${memTheme.bg} ${memTheme.text} shadow scale-105` : `bg-white ${memTheme.border} border hover:bg-morandi-bg`
                                        }">
                                            <span>${m.name}</span>
                                        </button>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <!-- Progress Bar -->
                    <div class="bg-white rounded-2xl p-6 border border-morandi-border shadow-sm space-y-3">
                        <div class="flex items-center justify-between font-bold text-base text-morandi-text">
                            <span>準備進度 (${completedCount} / ${filteredList.length})</span>
                            <span class="font-mono text-morandi-purple">${progressPct}%</span>
                        </div>
                        <div class="w-full bg-morandi-bg rounded-full h-3 overflow-hidden border border-morandi-border">
                            <div class="bg-morandi-purple h-full transition-all duration-300 rounded-full" style="width: ${progressPct}%"></div>
                        </div>
                    </div>

                    <!-- Checklist Items -->
                    <div class="bg-white rounded-2xl border border-morandi-border overflow-hidden shadow-sm divide-y divide-morandi-border/60">
                        ${filteredList.length === 0 ? `
                            <div class="p-8 text-center text-morandi-muted">目前尚無備忘清單項目</div>
                        ` : filteredList.map(item => {
                            const member = members.find(m => m.id === item.memberId) || { name: '全體', color: 'purple' };
                            const memTheme = MEMBER_COLOR_MAP[member.color] || MEMBER_COLOR_MAP.purple;

                            return `
                                <div class="p-4 sm:p-5 flex items-center justify-between hover:bg-morandi-bg/40 transition group">
                                    <div class="flex items-center space-x-3.5 flex-grow">
                                        <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleChecklistItem('${item.id}')" class="w-5 h-5 rounded-lg text-morandi-purple focus:ring-morandi-purple border-morandi-border cursor-pointer">
                                        <span class="text-xs px-2.5 py-1 rounded-full font-bold ${memTheme.bg} text-white">${member.name}</span>
                                        <span class="text-base sm:text-lg ${item.checked ? 'line-through text-morandi-muted' : 'text-morandi-text font-medium'}">${item.text}</span>
                                    </div>
                                    <div class="no-print flex space-x-1 opacity-80 group-hover:opacity-100 transition">
                                        <button onclick="deleteChecklistItem('${item.id}')" class="text-base text-morandi-muted hover:text-red-500 p-1.5 rounded"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function selectChecklistMember(memId) {
            appData.selectedMember = memId;
            saveData();
            renderActiveTabContent();
        }

        function toggleChecklistItem(id) {
            const item = appData.checklists.find(c => c.id === id);
            if (item) {
                item.checked = !item.checked;
                saveData();
                renderActiveTabContent();
            }
        }

        function deleteChecklistItem(id) {
            appData.checklists = appData.checklists.filter(c => c.id !== id);
            saveData();
            renderActiveTabContent();
            showToast("已刪除該清單項目");
        }

        function renderCustomTab(tab) {
            if (!tab.notes) tab.notes = [];
            if (!tab.todos) tab.todos = [];

            const showNotes = tab.notebookType === 'notes' || tab.notebookType === 'hybrid' || !tab.notebookType;
            const showTodos = tab.notebookType === 'todo' || tab.notebookType === 'hybrid';

            const colorStyle = COLOR_MAP[tab.color] || COLOR_MAP.purple;
            const completedTodos = tab.todos.filter(t => t.checked).length;
            const todoProgressPct = tab.todos.length ? Math.round((completedTodos / tab.todos.length) * 100) : 0;

            return `
                <div class="space-y-6">
                    <div class="flex items-center justify-between flex-wrap gap-3">
                        <div class="flex items-center space-x-2.5">
                            <span class="w-3.5 h-8 ${colorStyle.badge} rounded-full inline-block"></span>
                            <div>
                                <h2 class="text-2xl sm:text-3xl font-bold text-morandi-text">${tab.name}</h2>
                                <p class="text-xs sm:text-sm text-morandi-muted font-medium mt-0.5">
                                    ${tab.notebookType === 'todo' ? '☑️ 隨手待辦筆記' : tab.notebookType === 'hybrid' ? '📖 雙效筆記本 (文字 + 清單)' : '📝 隨手記事筆記'}
                                </p>
                            </div>
                        </div>

                        <div class="no-print flex items-center space-x-2">
                            ${showNotes ? `
                                <button onclick="quickAddStickyNote('${tab.id}')" class="text-sm bg-white border ${colorStyle.border} ${colorStyle.text} hover:${colorStyle.bg} px-3.5 py-2 rounded-xl font-bold transition shadow-sm flex items-center gap-1.5">
                                    <i class="fa-solid fa-note-sticky"></i> 新增便利貼
                                </button>
                            ` : ''}
                            ${showTodos ? `
                                <button onclick="openCustomTodoModal('${tab.id}')" class="text-sm ${colorStyle.badge} text-white hover:opacity-90 px-3.5 py-2 rounded-xl font-bold transition shadow-sm flex items-center gap-1.5">
                                    <i class="fa-solid fa-square-check"></i> 新增待辦
                                </button>
                            ` : ''}
                        </div>
                    </div>

                    ${showTodos ? `
                        <div class="bg-white rounded-2xl border border-morandi-border p-5 shadow-sm space-y-4">
                            <div class="flex items-center justify-between">
                                <h3 class="font-bold text-lg text-morandi-text flex items-center gap-2">
                                    <i class="fa-solid fa-list-check ${colorStyle.text}"></i> 待辦核對清單
                                </h3>
                                <span class="text-xs font-mono font-bold ${colorStyle.text} bg-morandi-bg px-2.5 py-1 rounded-full border border-morandi-border">
                                    進度 ${completedTodos} / ${tab.todos.length} (${todoProgressPct}%)
                                </span>
                            </div>

                            <div class="w-full bg-morandi-bg rounded-full h-2.5 overflow-hidden border border-morandi-border/60">
                                <div class="${colorStyle.badge} h-full transition-all duration-300 rounded-full" style="width: ${todoProgressPct}%"></div>
                            </div>

                            <div class="divide-y divide-morandi-border/60 pt-1">
                                ${tab.todos.length === 0 ? `
                                    <div class="py-6 text-center text-sm text-morandi-muted">目前尚無待辦事項，點擊右上角「新增待辦」即可新增！</div>
                                ` : tab.todos.map(todo => `
                                    <div class="py-3 flex items-center justify-between hover:bg-morandi-bg/40 px-2 rounded-xl transition group">
                                        <label class="flex items-center space-x-3 cursor-pointer flex-grow">
                                            <input type="checkbox" ${todo.checked ? 'checked' : ''} onchange="toggleCustomTodo('${tab.id}', '${todo.id}')" class="w-5 h-5 rounded-md text-morandi-purple focus:ring-morandi-purple border-morandi-border cursor-pointer">
                                            <span class="text-base ${todo.checked ? 'line-through text-morandi-muted' : 'text-morandi-text font-medium'}">${todo.text}</span>
                                        </label>
                                        <button onclick="deleteCustomTodo('${tab.id}', '${todo.id}')" class="no-print opacity-80 group-hover:opacity-100 text-morandi-muted hover:text-red-500 p-1.5 transition text-sm">
                                            <i class="fa-solid fa-trash"></i>
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    ${showNotes ? `
                        <div class="space-y-4">
                            <div class="flex items-center justify-between">
                                <h3 class="font-bold text-lg text-morandi-text flex items-center gap-2">
                                    <i class="fa-solid fa-book-bookmark ${colorStyle.text}"></i> 筆記便利貼 (${tab.notes.length})
                                </h3>
                            </div>

                            ${tab.notes.length === 0 ? `
                                <div class="bg-white rounded-2xl p-8 text-center text-morandi-muted border border-morandi-border">
                                    此頁籤目前沒有筆記備忘。點選右上角「新增便利貼」即可直接在頁面建立卡片！
                                </div>
                            ` : `
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    ${tab.notes.map(note => `
                                        <div onclick="openNoteDetail('${tab.id}', '${note.id}')" class="bg-amber-50/70 hover:bg-amber-50 rounded-2xl border border-amber-200/80 p-5 shadow-sm hover:shadow-md transition space-y-3 flex flex-col justify-between group relative cursor-pointer">
                                            <div class="space-y-2">
                                                <div class="flex items-start justify-between gap-2">
                                                    <h4 class="font-bold text-lg text-morandi-text leading-snug hover:text-morandi-purple transition">${note.title}</h4>
                                                    <div class="no-print flex items-center space-x-1 opacity-80 group-hover:opacity-100 transition flex-shrink-0" onclick="event.stopPropagation()">
                                                        <button onclick="openNoteEditor('${tab.id}', '${note.id}')" title="編輯筆記" class="text-sm text-morandi-muted hover:text-morandi-purple p-1.5 rounded hover:bg-white/80"><i class="fa-solid fa-pen"></i></button>
                                                        <button onclick="deleteNote('${tab.id}', '${note.id}')" title="刪除筆記" class="text-sm text-morandi-muted hover:text-red-500 p-1.5 rounded hover:bg-white/80"><i class="fa-solid fa-trash"></i></button>
                                                    </div>
                                                </div>

                                                <p class="text-sm text-morandi-muted leading-relaxed whitespace-pre-line line-clamp-4">${note.content}</p>
                                            </div>

                                            <div class="pt-2 border-t border-amber-200/60 flex items-center justify-between text-xs font-semibold text-morandi-muted">
                                                <span class="text-morandi-purple flex items-center gap-1.5"><i class="fa-solid fa-book-open"></i> 點擊閱讀全文</span>
                                                ${note.link ? `<span class="text-morandi-blue truncate max-w-[140px]"><i class="fa-solid fa-link mr-1"></i>有附連結</span>` : ''}
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            `}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function quickAddStickyNote(tabId) {
            const tab = appData.tabs.find(t => t.id === tabId);
            if (tab) {
                if (!tab.notes) tab.notes = [];
                const newNote = {
                    id: `note-${Date.now()}`,
                    title: "新便利貼備忘",
                    content: "點擊此便利貼卡片可開啟大圖彈窗閱讀完整內容，或點擊右上角筆型圖示編輯標題與內文。",
                    link: ""
                };
                tab.notes.unshift(newNote);
                saveData();
                renderActiveTabContent();
                showToast("已在頁面上新增便利貼！");
            }
        }

        function openNoteDetail(tabId, noteId) {
            const tab = appData.tabs.find(t => t.id === tabId);
            if (!tab || !tab.notes) return;
            const note = tab.notes.find(n => n.id === noteId);
            if (!note) return;

            const colorStyle = COLOR_MAP[tab.color] || COLOR_MAP.purple;
            const modalBox = document.getElementById("modal-box");
            modalBox.innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-start justify-between border-b border-morandi-border pb-3">
                        <div class="flex items-center space-x-2.5">
                            <span class="w-3.5 h-7 ${colorStyle.badge} rounded-full inline-block"></span>
                            <h3 class="text-xl sm:text-2xl font-bold text-morandi-text leading-snug">${note.title}</h3>
                        </div>
                        <button onclick="closeModal()" class="text-morandi-muted hover:text-morandi-text text-xl p-1 font-bold">✕</button>
                    </div>

                    <div class="bg-morandi-bg/80 p-4 sm:p-5 rounded-2xl border border-morandi-border/80 max-h-[55vh] overflow-y-auto">
                        <p class="text-base text-morandi-text leading-relaxed whitespace-pre-line">${note.content || '目前無內文說明'}</p>
                    </div>

                    ${note.link ? `
                        <div class="p-3 bg-morandi-blueLight rounded-xl border border-morandi-blue/20">
                            <a href="${note.link}" target="_blank" class="inline-flex items-center text-sm font-bold text-morandi-blue hover:underline break-all">
                                <i class="fa-solid fa-arrow-up-right-from-square mr-2"></i>開啟相關參考連結 ➔
                            </a>
                        </div>
                    ` : ''}

                    <div class="flex items-center justify-between pt-2">
                        <button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-morandi-border text-morandi-muted font-semibold hover:bg-morandi-bg text-sm">關閉閱讀</button>
                        <button onclick="closeModal(); openNoteEditor('${tab.id}', '${note.id}')" class="px-4 py-2 rounded-xl ${colorStyle.badge} text-white font-bold hover:opacity-90 text-sm flex items-center gap-1.5 shadow-sm">
                            <i class="fa-solid fa-pen"></i> 編輯此筆記
                        </button>
                    </div>
                </div>
            `;
            document.getElementById("modal-container").classList.remove("hidden");
        }

        function openCustomTodoModal(tabId) {
            const modalBox = document.getElementById("modal-box");
            modalBox.innerHTML = `
                <h3 class="text-xl font-bold text-morandi-text">☑️ 新增待辦清單項目</h3>
                <div class="space-y-3">
                    <div>
                        <label class="text-xs font-semibold text-morandi-muted block mb-1">待辦內容</label>
                        <input type="text" id="custom-todo-text" placeholder="例如：購買日本 eSIM 網卡、準備防水相機袋" class="w-full px-3.5 py-2.5 rounded-xl border border-morandi-border font-medium focus:ring-2 focus:ring-morandi-purple focus:outline-none">
                    </div>
                </div>
                <div class="flex items-center justify-end space-x-3 pt-3">
                    <button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-morandi-border text-morandi-muted font-semibold hover:bg-morandi-bg">取消</button>
                    <button onclick="saveCustomTodo('${tabId}')" class="px-5 py-2 rounded-xl bg-morandi-purple text-white font-bold hover:bg-morandi-purple/90">新增項目</button>
                </div>
            `;
            document.getElementById("modal-container").classList.remove("hidden");
        }

        function saveCustomTodo(tabId) {
            const text = document.getElementById("custom-todo-text").value.trim();
            if (!text) {
                showToast("請輸入待辦內容");
                return;
            }

            const tab = appData.tabs.find(t => t.id === tabId);
            if (tab) {
                if (!tab.todos) tab.todos = [];
                tab.todos.push({
                    id: `todo-${Date.now()}`,
                    text: text,
                    checked: false
                });
                saveData();
                closeModal();
                renderActiveTabContent();
                showToast("已成功新增待辦事項");
            }
        }

        function toggleCustomTodo(tabId, todoId) {
            const tab = appData.tabs.find(t => t.id === tabId);
            if (tab && tab.todos) {
                const todo = tab.todos.find(t => t.id === todoId);
                if (todo) {
                    todo.checked = !todo.checked;
                    saveData();
                    renderActiveTabContent();
                }
            }
        }

        function deleteCustomTodo(tabId, todoId) {
            const tab = appData.tabs.find(t => t.id === tabId);
            if (tab && tab.todos) {
                tab.todos = tab.todos.filter(t => t.id !== todoId);
                saveData();
                renderActiveTabContent();
                showToast("已刪除該待辦項目");
            }
        }

        function openNoteEditor(tabId, noteId = null) {
            const tab = appData.tabs.find(t => t.id === tabId);

            const title = document.getElementById("note-title").value.trim();

            const link = document.getElementById("note-link").value.trim();

            if (!title) {
                showToast("請輸入筆記標題");
                return;
            }

            const tab = appData.tabs.find(t => t.id === tabId);
            if (tab) {
                if (!tab.notes) tab.notes = [];

                if (noteId) {
                    const note = tab.notes.find(n => n.id === noteId);
                    if (note) {
                        note.title = title;
                        note.content = content;
                        note.link = link;
                    }
                } else {
                    tab.notes.push({
                        id: `note-${Date.now()}`,
                        title: title,
                        content: content,
                        link: link
                    });
                }

                saveData();
                closeModal();
                renderActiveTabContent();
                showToast("筆記已儲存");
            }
        }

        function saveSpot(dayNum, spotId) {
            const dayObj = appData.itinerary.find(d => d.dayNum === dayNum);
            if (!dayObj) return;

            const time = document.getElementById("spot-time").value.trim() || "10:00";
            const tag = document.getElementById("spot-tag").value;
            const title = document.getElementById("spot-title").value.trim();
            const note = document.getElementById("spot-note").value.trim();
            const driveNote = document.getElementById("spot-drive").value.trim();
            const toiletNote = document.getElementById("spot-toilet").value.trim();
            const mapUrl = document.getElementById("spot-map").value.trim();

            if (!title) {
                showToast("請輸入景點名稱");
                return;
            }

            if (spotId) {
                const spot = dayObj.spots.find(s => s.id === spotId);
                if (spot) {
                    spot.time = time;
                    spot.tag = tag;
                    spot.title = title;
                    spot.note = note;
                    spot.driveNote = driveNote;
                    spot.toiletNote = toiletNote;
                    spot.mapUrl = mapUrl;
                }
            } else {
                dayObj.spots.push({
                    id: `s-${Date.now()}`,
                    time, tag, title, note, driveNote, toiletNote, mapUrl
                });
            }

            saveData();
            closeModal();
            renderActiveTabContent();
            showToast("景點已儲存");
        }

            showToast("費用已儲存");
        }

        function editExpense(expId) {
            openExpenseEditor(expId);
        }

        function deleteExpense(expId) {
            appData.expenses = appData.expenses.filter(e => e.id !== expId);
            saveData();
            renderActiveTabContent();
            showToast("已刪除該筆費用");
        }

        function openChecklistEditor() {
            const members = appData.checklistMembers || [];
            const modalBox = document.getElementById("modal-box");
            modalBox.innerHTML = `
                <h3 class="text-xl font-bold text-morandi-text">➕ 新增準備清單項目</h3>
                <div class="space-y-3.5">
                    <div>
                        <label class="text-xs font-semibold text-morandi-muted block mb-1">負責成員</label>
                        <select id="ck-member" class="w-full px-3 py-2 rounded-xl border border-morandi-border">
                            ${members.map(m => `<option value="${m.id}">${m.name}</option>`).join('')}
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-morandi-muted block mb-1">準備物品 / 項目</label>
                        <input type="text" id="ck-text" placeholder="例如 帶護照與日文譯本" class="w-full px-3 py-2 rounded-xl border border-morandi-border font-medium">
                    </div>
                </div>
                <div class="flex items-center justify-end space-x-3 pt-2">
                    <button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-morandi-border text-morandi-muted font-semibold hover:bg-morandi-bg">取消</button>
                    <button onclick="saveChecklist()" class="px-5 py-2 rounded-xl bg-morandi-yellow text-morandi-text font-bold hover:bg-morandi-yellow/90">新增清單</button>
                </div>
            `;
            document.getElementById("modal-container").classList.remove("hidden");
        }

        function saveChecklist() {
            const memberId = document.getElementById("ck-member").value;
            const text = document.getElementById("ck-text").value.trim();

            if (!text) {
                showToast("請輸入內容");
                return;
            }

            appData.checklists.push({
                id: `ck-${Date.now()}`,
                memberId: memberId,
                text: text,
                checked: false
            });

            saveData();
            closeModal();
            renderActiveTabContent();
            showToast("已新增注意事項");
        }

        /* 交通規劃憑證 Modal (修正儲存失靈問題) */
        function openTimeTransportEditor(id = null) {
            let item = { category: "去程航班 ✈️", title: "", date: "", time: "", location: "", code: "", note: "", mapUrl: "" };
            if (id) {
                const found = appData.timeTransport.find(t => t.id === id);
                if (found) item = found;
            }

            const modalBox = document.getElementById("modal-box");
            modalBox.innerHTML = `
                <h3 class="text-xl font-bold text-morandi-text">${id ? '✏️ 編輯交通規劃' : '➕ 新增交通規劃'}</h3>
                <div class="space-y-3.5">
                    <div>
                        <label class="text-xs font-semibold text-morandi-muted block mb-1">分類類別</label>
                        <input type="text" id="tt-cat" value="${item.category}" placeholder="例如 去程航班 / 租車資訊" class="w-full px-3 py-2 rounded-xl border border-morandi-border">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-morandi-muted block mb-1">名稱標題</label>
                        <input type="text" id="tt-title" value="${item.title}" placeholder="例如 樂桃航空 MM924" class="w-full px-3 py-2 rounded-xl border border-morandi-border font-bold">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs font-semibold text-morandi-muted block mb-1">日期</label>
                            <input type="text" id="tt-date" value="${item.date}" placeholder="例如 2026-12-19 (六)" class="w-full px-3 py-2 rounded-xl border border-morandi-border text-xs">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-morandi-muted block mb-1">時間</label>
                            <input type="text" id="tt-time" value="${item.time}" placeholder="例如 18:00 - 20:30" class="w-full px-3 py-2 rounded-xl border border-morandi-border text-xs">
                        </div>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-morandi-muted block mb-1">地點 / 路線</label>
                        <input type="text" id="tt-loc" value="${item.location}" placeholder="桃園 T1 ➔ 那霸 T1" class="w-full px-3 py-2 rounded-xl border border-morandi-border text-xs">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-morandi-muted block mb-1">訂位編號與備註</label>
                        <input type="text" id="tt-code" value="${item.code || ''}" placeholder="請輸入訂位代碼" class="w-full px-3 py-2 rounded-xl border border-morandi-border mb-2 text-xs font-mono">
                        <textarea id="tt-note" rows="2" placeholder="詳細轉乘說明或備註" class="w-full px-3 py-2 rounded-xl border border-morandi-border text-xs">${item.note || ''}</textarea>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-morandi-muted block mb-1">Google 地圖 / 相關網址</label>
                        <input type="text" id="tt-map" value="${item.mapUrl || ''}" placeholder="https://..." class="w-full px-3 py-2 rounded-xl border border-morandi-border text-xs">
                    </div>
                </div>
                <div class="flex items-center justify-end space-x-3 pt-2">
                    <button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-morandi-border text-morandi-muted font-semibold hover:bg-morandi-bg">取消</button>
                    <button onclick="saveTimeTransport('${id || ''}')" class="px-5 py-2 rounded-xl bg-morandi-purple text-white font-bold hover:bg-morandi-purple/90">儲存規劃</button>
                </div>
            `;
            document.getElementById("modal-container").classList.remove("hidden");
        }

        function saveTimeTransport(id) {
            const category = document.getElementById("tt-cat").value.trim();
            const title = document.getElementById("tt-title").value.trim();
            const date = document.getElementById("tt-date").value.trim();
            const time = document.getElementById("tt-time").value.trim();
            const location = document.getElementById("tt-loc").value.trim();
            const code = document.getElementById("tt-code").value.trim();
            const note = document.getElementById("tt-note").value.trim();
            const mapUrl = document.getElementById("tt-map").value.trim();

            if (!title) {
                showToast("請輸入名稱標題");
                return;
            }

            if (!appData.timeTransport) {
                appData.timeTransport = [];
            }

            if (id) {
                const tt = appData.timeTransport.find(t => t.id === id);
                if (tt) {
                    Object.assign(tt, { category, title, date, time, location, code, note, mapUrl });
                }
            } else {
                appData.timeTransport.push({
                    id: `tt-${Date.now()}`,
                    category, title, date, time, location, code, note, mapUrl
                });
            }

            saveData();
            closeModal();
            renderActiveTabContent();
            showToast("交通規劃已成功儲存！");
        }

        function editTimeTransport(id) {
            openTimeTransportEditor(id);
        }

        function deleteTimeTransport(id) {
            appData.timeTransport = appData.timeTransport.filter(t => t.id !== id);
            saveData();
            renderActiveTabContent();
            showToast("已刪除該交通規劃");
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `沖繩手札備份_${new Date().toISOString().slice(0,10)}.json`);
            dlAnchorElem.click();
            showToast("手札資料已成功備份匯出");
        }

        function importData(event) {
            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported && imported.tabs) {
                        appData = imported;
                        saveData();
                        initApp();
                        showToast("手札資料匯入成功！");
                    } else {
                        showToast("匯入格式不正確");
                    }
                } catch (err) {
                    showToast("讀取檔案失敗");
                }
            };
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0]);
            }
        }

        window.onload = function() {
            initApp();
        };
    </script>
</body>
</html>
